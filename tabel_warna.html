<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Warna</title>
</head>
<body>
   <table border="1" bordercolor="white" width="500" height="600">

        <tr>
            <td bgcolor="blue" rowspan="7" width="100" height="100"></td>
            <td bgcolor="blue" colspan="3" width="300" height="100"></td>
        </tr>

          <tr>
            <td bgcolor="lime" width="100" height="80"></td>

            <td colspan="2" rowspan="2" bgcolor="lime" width="200" height="160"></td>

            <td rowspan="2" bgcolor="blue" width="80" height="160"></td>
        </tr>

        <tr>
            <td></td>
        </tr>

        <tr>
            <td bgcolor="blue" width="100" height="80"></td>
            <td width="100" height="80"></td>
            <td bgcolor="blue" width="100" height="80"></td>
        </tr>

        <tr>
            <td width="100" height="100"></td>
        </tr>
    </table>
</body>
</html>
