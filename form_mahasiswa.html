<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data Mahasiswa</title>
</head>
<body>
    <h2>Data Mahasiswa</h2>

    <form id="formMahasiswa">
        <label>NIM : </label>
        <input type="text" name="nim" id="nim" required>
        <br><br>

        <label>Nama : </label>
        <input type="text" name="nama" id="nama" required>
        <br><br>

        <label>Tanggal Lahir : </label>
        <input type="date" name="tanggal_lahir" id="tanggal_lahir" required>
        <br><br>

        <label>Jenis Kelamin : </label>
        <input type = "radio" name="jenis_kelamin" value="laki-laki" required> Laki-laki
        <input type = "radio" name="jenis_kelamin" value="perempuan" required> Perempuan
        <br><br>

        <label>Alamat di Bandung : </label>
        <textarea name="alamat" rows="4" cols="25" required></textarea>
        <br><br>

        <label>Tinggal di : </label>
        <select name="tempat_tinggal" required>
            <option value="">pilih</option>
            <option value="Kos / Kontrakan">Kos / Kontrakan</option>
            <option value="Rumah Saudara">Rumah Saudara</option>
            <option value="Rumah Orang Tua">Rumah Orang Tua</option>
        </select>

        <br><br>
        <label>Pilih 2 Hobi : </label>
        <input type="checkbox" name="hobi[]" value="Science"> Science
        <input type="checkbox" name="hobi[]" value="Technology"> Technology
        <input type="checkbox" name="hobi[]" value="Art"> Art
        <input type="checkbox" name="hobi[]" value="Sport"> Sport

        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
